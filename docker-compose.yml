# TrustPay - the AI mediation service.
#
#   docker compose up -d --build
#   curl http://localhost:4100/health
#
# TrustPay's container ONLY. Bizik runs from its own compose file, as it
# always has - duplicating its services here would mean two definitions of the
# same stack drifting apart, and this service does not need them to run.
#
# What that leaves is the point: no database, no redis, no payment rail, no
# credential for any of them. "The model cannot move money" is a fact about
# what this container is given, not a promise made in a README.

services:
  # ---- TrustPay: the hackathon build ---------------------------------------

  trustpay:
    build:
      context: .
    container_name: trustpay-service
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PORT: "4100"
      # Meta Model API. Pinned ids: the docs list muse-spark-1.3, 1.2 and 1.1
      # and at least one client defaults to 1.1, so an unpinned id would let
      # the demo change under us mid-build.
      # Not :? - the service starts without it so the scrubber can be
      # exercised, and /health reports NOT READY rather than lying.
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      MUSE_SPARK_MODEL: ${MUSE_SPARK_MODEL:-muse-spark-1.3}
      MUSE_WONDER_MODEL: ${MUSE_WONDER_MODEL:-muse-wonder-1.0}
      MUSE_VOICE_MODEL: ${MUSE_VOICE_MODEL:-}
      SAM_MODEL: ${SAM_MODEL:-}
      # Open-weight path, for the harness and the open-weights prize. The
      # meta-models/ prefix is part of the id and must not be dropped.
      OPEN_WEIGHTS_BASE_URL: ${OPEN_WEIGHTS_BASE_URL:-}
      OPEN_WEIGHTS_API_KEY: ${OPEN_WEIGHTS_API_KEY:-}
      OPEN_WEIGHTS_MODEL: ${OPEN_WEIGHTS_MODEL:-meta-models/muse-spark-open-1026}
      # Escalate rather than decide. Deliberately cautious defaults.
      ESCALATE_BELOW_CONFIDENCE: ${ESCALATE_BELOW_CONFIDENCE:-0.75}
      ESCALATE_ABOVE_AMOUNT_XAF: ${ESCALATE_ABOVE_AMOUNT_XAF:-250000}
      # Posts a suggestion row and nothing else. There is deliberately no
      # endpoint behind this token that could resolve a dispute.
      # Bizik runs from its own compose file, so reach it on the host.
      BIZIK_API_BASE_URL: ${BIZIK_API_BASE_URL:-http://host.docker.internal:4000/api/v1}
      BIZIK_SERVICE_TOKEN: ${BIZIK_SERVICE_TOKEN:-dev-service-token}
      # Evidence arrives as WhatsApp media URLs. TrustPay fetches, processes
      # and drops it - nothing is retained between requests.
      WASENDER_API_KEY: ${WASENDER_API_KEY:-}
      WASENDER_BASE_URL: ${WASENDER_BASE_URL:-}
    ports: ["4100:4100"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    # NOTE the networks: `platform` to talk to the backend, and that is all.
    # No postgres credential is passed and none would help - but the service
    # also has no reason to hold one, so it does not.
    networks: [trustpay]

networks:
  trustpay:
    driver: bridge
