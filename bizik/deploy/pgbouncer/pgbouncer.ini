; =============================================================================
; Bizik — PgBouncer (host-native)  ->  /etc/pgbouncer/pgbouncer.ini
; -----------------------------------------------------------------------------
; PostgreSQL runs natively on 127.0.0.1:5432 (NOT in Docker). PgBouncer pools
; connections in front of it. Two logical databases point at the same physical
; DB with different pool modes:
;   * bizik          -> transaction pooling  (the app's runtime DATABASE_URL)
;   * bizik_session  -> session pooling       (Prisma `db push` / migrations —
;                       DDL + advisory locks need a stable server connection)
; =============================================================================

[databases]
bizik         = host=127.0.0.1 port=5432 dbname=bizik
bizik_session = host=127.0.0.1 port=5432 dbname=bizik pool_mode=session

[pgbouncer]
; Listen on all host interfaces so the Docker containers can reach PgBouncer
; via host.docker.internal (host-gateway). Port 6432 is firewalled off the
; public internet by ufw and only reachable from the Docker bridge subnet.
listen_addr = *
listen_port = 6432

; SCRAM auth against the userlist below (generated from the Postgres role).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Global default is transaction pooling (best for a stateless web API + Prisma).
pool_mode = transaction

; Prisma sends its own prepared statements; with `?pgbouncer=true` on the URL it
; disables them, so transaction pooling is safe.
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 240
server_lifetime = 3600

; Who can run PgBouncer admin console (psql -p 6432 pgbouncer).
admin_users = bizik
stats_users = bizik

ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
