# =============================================================================
# Bizik — nginx reverse proxy (production, Let's Encrypt, NO CDN)
#   bizik.cm / www.bizik.cm  -> web-user:3000   (marketing site + user PWA)
#   admin.bizik.cm           -> web-admin:3000  (admin console)
#   api.bizik.cm             -> backend:3000    (REST API + webhooks + socket.io)
#
# TLS is terminated here with a Let's Encrypt certificate (mounted read-only from
# the host's /etc/letsencrypt). There is NO proxy in front, so the real client
# address is $remote_addr directly — we do NOT trust any X-Forwarded / CF-* header
# from the network. Issue the cert once with certbot BEFORE the first
# `docker compose up` (see DEPLOYMENT.md Part E); renewals use the webroot served
# by the :80 block below.
#
# IF A CDN IS EVER PUT IN FRONT: every rate limit here keys on $binary_remote_addr,
# which would then be the CDN's address and would throttle all users as one. Add
# `set_real_ip_from <cdn ranges>; real_ip_header CF-Connecting-IP;` at that point,
# and not before — trusting that header without the CDN lets anyone spoof an IP
# and walk straight past these limits.
# =============================================================================

# Re-resolve container IPs at request time (survives container recreation).
# Docker's internal DNS ONLY — adding a public resolver here would break
# `backend:3000` style lookups. That is also why OCSP stapling is not enabled:
# it needs a public resolver, and Let's Encrypt is retiring OCSP in favour of
# CRLs, so it would be cost without benefit.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade support (socket.io realtime on the API).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- Abuse limits ------------------------------------------------------------
# Per-IP request rates. `webhooks` is generous because providers burst; `auth`
# is deliberately mean because those endpoints are the ones worth attacking.
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m      rate=15r/s;
limit_req_zone $binary_remote_addr zone=web:10m      rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m     rate=2r/s;

# Concurrent connections per IP. Rate limits alone do not stop one host holding
# hundreds of sockets open, which is how a small botnet exhausts a server
# without ever sending a lot of requests.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Say 429 rather than the default 503: it is accurate, and clients back off.
limit_req_status 429;
limit_conn_status 429;

# --- Slow-client protection (slowloris) --------------------------------------
# Defaults let a client dribble a request out for a minute per header. These
# caps free the worker slot quickly instead.
client_header_timeout 10s;
client_body_timeout   15s;
send_timeout          20s;
keepalive_requests    200;
reset_timedout_connection on;
# (keepalive_timeout is set per server block below: the base nginx.conf already
#  declares it at http level, and declaring it twice there is a config error.)
client_body_buffer_size 128k;
large_client_header_buffers 4 8k;

# --- Shared TLS (Let's Encrypt) ---------------------------------------------
ssl_certificate     /etc/letsencrypt/live/bizik.cm/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/bizik.cm/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
# Forward secrecy and AEAD only. `HIGH:!aNULL:!MD5` still allowed CBC suites,
# which is what downgrade and padding-oracle attacks reach for.
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve      X25519:prime256v1:secp384r1;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/javascript text/plain text/css image/svg+xml;

# Scanners hammer these constantly. Closing the connection outright costs one
# packet instead of a proxied round trip to an app that will 404 anyway.
map $request_uri $is_probe {
    default                       0;
    ~*^/\.(env|git|aws|ssh)       1;
    ~*^/wp-(admin|login|content|includes) 1;
    ~*^/(phpmyadmin|phpinfo|vendor/phpunit) 1;
    ~*\.(php|asp|aspx|jsp|cgi)$   1;
}

# --- HTTP :80 — ACME challenges + redirect ----------------------------------
# certbot writes challenge files under the mounted webroot; everything else is
# redirected to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Unknown hostnames on :443 ----------------------------------------------
# Without this, a request carrying any other Host header lands on the FIRST
# server block below — the API. Anything not addressed to us is dropped.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    return 444;
}

# --- api.bizik.cm : backend API ---------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.bizik.cm;
    keepalive_timeout 30s;

    # KYC documents and dispute evidence are posted as base64 JSON, so this one
    # stays generous. Everything here is authenticated except the webhooks.
    client_max_body_size 25m;
    limit_conn conn_per_ip 40;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Responses here carry session tokens. Compressing them alongside
    # attacker-influenced content is what BREACH exploits, and API payloads are
    # small enough that compression buys little.
    gzip off;

    if ($is_probe) { return 444; }

    # Credentials, OTPs and password resets: the endpoints worth brute-forcing.
    # The app limits these too; this keeps the flood off the app entirely.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        set $up backend:3000;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Provider webhooks (unauthenticated by design) — rate-limited per IP.
    location /api/v1/payments/webhooks/ {
        limit_req zone=webhooks burst=20 nodelay;
        set $up backend:3000;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (REST + WhatsApp webhook + socket.io).
    location / {
        limit_req zone=api burst=30 nodelay;
        set $up backend:3000;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# --- admin.bizik.cm : admin console -----------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.bizik.cm;
    keepalive_timeout 30s;

    # The console uploads nothing directly; files go through the API.
    client_max_body_size 2m;
    limit_conn conn_per_ip 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    if ($is_probe) { return 444; }

    location / {
        limit_req zone=web burst=60 nodelay;
        set $up web-admin:3000;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- bizik.cm + www : marketing site + user PWA -----------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name bizik.cm www.bizik.cm;
    keepalive_timeout 30s;

    client_max_body_size 2m;
    limit_conn conn_per_ip 50;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($is_probe) { return 444; }

    # Send www -> apex.
    if ($host = www.bizik.cm) { return 301 https://bizik.cm$request_uri; }

    # Immutable Next.js build assets — cache hard.
    location /_next/static/ {
        set $up web-user:3000;
        proxy_pass http://$up;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=web burst=60 nodelay;
        set $up web-user:3000;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
